<title>Tycho</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --ground: #080a0e;
    --surface: #0e1117;
    --border: #1a1f2a;
    --text: #ddd9d2;
    --muted: #6b7080;
    --glow: #4fb8e8;
    --glow-dim: rgba(79, 184, 232, 0.12);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  body {
    background: var(--ground);
    color: var(--text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', 'Menlo', monospace;
  }

  .frame {
    max-width: 620px;
    width: 100%;
    padding: 24px 16px 48px;
    box-sizing: border-box;
  }

  .nameplate {
    text-align: center;
    margin-bottom: 28px;
  }

  .nameplate h1 {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--text);
    margin: 0;
    line-height: 1;
    text-indent: 0.38em;
  }

  .nameplate .rule {
    width: 64px;
    height: 1px;
    background: var(--glow);
    margin: 14px auto 0;
    opacity: 0.6;
  }

  .portrait {
    position: relative;
    width: 100%;
    border-radius: 3px;
    overflow: hidden;
    line-height: 0;
  }

  .portrait::after {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 60px 20px var(--ground);
    pointer-events: none;
    border-radius: 3px;
  }

  .portrait img {
    width: 100%;
    display: block;
    border-radius: 3px;
  }

  .glow-wash {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 80px;
    background: radial-gradient(ellipse, var(--glow-dim), transparent 70%);
    pointer-events: none;
  }

  .caption {
    position: relative;
    text-align: center;
    margin-top: 24px;
    padding-top: 20px;
  }

  .caption .rule {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 0 auto 16px;
  }

  .caption .primary {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  .caption .secondary {
    font-size: 0.68rem;
    font-weight: 400;
    color: var(--muted);
    opacity: 0.6;
    letter-spacing: 0.06em;
    margin: 0;
  }

  .seq {
    color: var(--glow);
    opacity: 0.7;
  }
</style>

<div class="frame">
  <div class="nameplate">
    <h1>Tycho</h1>
    <div class="rule"></div>
  </div>

  <div class="portrait">
    <img src="portrait.jpg" alt="Tycho: Roomba 805 base, 7-inch HDMI face display showing blue animated eyes, thingino pan-tilt camera dome, Pi 5 with exposed wiring — lit by blue ambient light on carpet">
    <div class="glow-wash"></div>
  </div>

  <div class="caption">
    <div class="rule"></div>
    <p class="primary">Embodied · Alexandria · <span class="seq">seq 29</span></p>
    <p class="secondary">15 September 2026</p>
  </div>
</div>
