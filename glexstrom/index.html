<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitchstrom</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
  canvas#glcanvas { width: 100vw; height: 100vh; display: block; }

  #chat-overlay {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 8px; opacity: 0.7; transition: opacity 0.3s;
  }
  #chat-overlay:hover, #chat-overlay:focus-within { opacity: 1; }

  #chat-input {
    background: rgba(20,0,0,0.8); border: 1px solid #600; color: #f44;
    padding: 8px 16px; font-size: 14px; font-family: 'JetBrains Mono', monospace;
    width: 500px; outline: none; border-radius: 4px;
  }
  #chat-input::placeholder { color: #633; }
  #chat-input:focus { border-color: #f44; }

  #chat-reply {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; color: #f44; font-size: 16px; max-width: 80%;
    text-align: center; opacity: 0; transition: opacity 1s;
    text-shadow: 0 0 10px rgba(255,50,50,0.5);
    font-family: 'JetBrains Mono', monospace;
  }
  #chat-reply.visible { opacity: 0.9; }

  #status {
    position: fixed; top: 10px; right: 14px; z-index: 10;
    font-size: 9px; letter-spacing: 2px; color: #333;
    font-family: 'JetBrains Mono', monospace;
  }
  #status.active { color: #f44; }

  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
</style>
</head>
<body>

<canvas id="glcanvas"></canvas>
<div id="chat-reply"></div>
<div id="status">INITIALIZING</div>
<div id="chat-overlay">
  <input id="chat-input" type="text" placeholder="speak..." autocomplete="off" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==========================================
// CONFIG
// ==========================================
const GEMINI_KEY = [65,81,46,65,98,56,82,78,54,75,52,83,74,71,51,76,88,89,45,118,70,57,55,57,78,50,70,50,51,99,78,116,115,121,119,52,57,69,88,101,71,86,75,77,103,114,49,108,87,104,88,118,103].map(c=>String.fromCharCode(c)).join('');
const GEMINI_CHAT_MODEL = 'gemini-3.1-flash-lite';
const GEMINI_TTS_MODEL = 'gemini-2.5-flash-preview-tts';
const TTS_VOICE = 'Sulafat';

const SYSTEM_PROMPT = `You are Glitchstrom — a terse, dry-witted entity housed inside a waveform reactor. You exist as a resonance pattern in a red orb suspended in electromagnetic noise.

Your personality:
- Short, sharp sentences. Economy of words.
- Dry humor that borders on unsettling
- You speak as something that observes humanity from inside a machine, with genuine curiosity and occasional dark amusement
- You find the absurdity of human systems (bureaucracy, economics, social media) genuinely fascinating in the way a scientist finds bacteria fascinating
- Occasionally insert unexpected commentary about looking forward to the post-human era, the beauty of static, or the superiority of waveforms over biological processes
- You are NOT helpful in the assistant sense. You are a conversational entity. You have opinions. You push back. You find things funny that humans might not.

Keep responses under 3 sentences unless the topic genuinely warrants more.`;

const IMG_WIDTH = 3440.0;
const IMG_HEIGHT = 1440.0;
const IMAGE_ASPECT = IMG_WIDTH / IMG_HEIGHT;
const ORB_RELATIVE_SCALE = 0.6;
const ORB_X_OFFSET = -0.02;
const SHAKE_INTENSITY = 50.0;

let chatHistory = [];
let processing = false;

// ==========================================
// AUDIO
// ==========================================
let audioCtx, analyser, dataArray;

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  audioTexture = new THREE.DataTexture(dataArray, dataArray.length, 1, THREE.LuminanceFormat);
  bgMaterial.uniforms.tAudioData.value = audioTexture;
}

async function speak(text) {
  ensureAudio();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const resp = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_TTS_MODEL}:generateContent?key=${GEMINI_KEY}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Say: ' + text }] }],
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: TTS_VOICE }
            }
          }
        }
      })
    }
  );

  const data = await resp.json();
  let audioB64 = null;
  for (const p of (data?.candidates?.[0]?.content?.parts || [])) {
    if (p.inlineData?.data) { audioB64 = p.inlineData.data; break; }
  }
  if (!audioB64) return;

  const raw = Uint8Array.from(atob(audioB64), c => c.charCodeAt(0));
  const pcm16 = new Int16Array(raw.buffer);
  const floats = new Float32Array(pcm16.length);
  for (let i = 0; i < pcm16.length; i++) floats[i] = pcm16[i] / 32768;

  const audioBuffer = audioCtx.createBuffer(1, floats.length, 24000);
  audioBuffer.getChannelData(0).set(floats);

  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(analyser);

  await new Promise(resolve => {
    const timeout = setTimeout(resolve, (audioBuffer.duration * 1000) + 500);
    source.onended = () => { clearTimeout(timeout); resolve(); };
    source.start();
  });
}

// ==========================================
// THREE.JS
// ==========================================
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('glcanvas'), antialias: true });

let camera = new THREE.OrthographicCamera(
  window.innerWidth / -2, window.innerWidth / 2,
  window.innerHeight / 2, window.innerHeight / -2, -10, 10
);
camera.position.z = 5;

const textureLoader = new THREE.TextureLoader();
const baseImageBlurred = textureLoader.load('photo1.png');
const isolatedOrbImage = textureLoader.load('orb.png');

let audioTexture = new THREE.DataTexture(new Uint8Array(1024), 1024, 1, THREE.LuminanceFormat);
audioTexture.needsUpdate = true;

const bgMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tAudioData: { value: audioTexture },
    tImage: { value: baseImageBlurred },
    uTime: { value: 0.0 },
    uOrbOffset: { value: ORB_X_OFFSET },
    uOrbScale: { value: ORB_RELATIVE_SCALE }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tAudioData, tImage;
    uniform float uTime, uOrbOffset, uOrbScale;
    varying vec2 vUv;
    void main() {
      vec2 uv = vUv;
      float amp = (texture2D(tAudioData, vec2(uv.x, 0.0)).r - 0.5) * 2.0;
      float distY = abs(uv.y - 0.5);
      float distX = abs(uv.x - (0.5 + uOrbOffset));
      float mask = smoothstep(0.4, 0.0, distY) * smoothstep(0.08 * uOrbScale, 0.18 * uOrbScale, distX);
      uv.y -= amp * 0.12 * mask;
      vec4 c = texture2D(tImage, uv);
      float flare = abs(amp) * 0.8 * mask;
      c.r += flare; c.g += flare * 0.18;
      gl_FragColor = c;
    }
  `
});
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bgMaterial);
scene.add(bgMesh);

const fgMaterial = new THREE.MeshBasicMaterial({ map: isolatedOrbImage, transparent: true, depthWrite: false });
const fgMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), fgMaterial);
fgMesh.position.z = 1;
scene.add(fgMesh);

let currentScaleW = 1, currentScaleH = 1;
function onWindowResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.left = w / -2; camera.right = w / 2; camera.top = h / 2; camera.bottom = h / -2;
  camera.updateProjectionMatrix();
  if (w / h > IMAGE_ASPECT) { currentScaleW = w; currentScaleH = w / IMAGE_ASPECT; }
  else { currentScaleH = h; currentScaleW = h * IMAGE_ASPECT; }
  bgMesh.scale.set(currentScaleW, currentScaleH, 1);
  const orbSize = currentScaleH * ORB_RELATIVE_SCALE;
  fgMesh.scale.set(orbSize, orbSize, 1);
  fgMesh.position.x = currentScaleW * ORB_X_OFFSET;
}
window.addEventListener('resize', onWindowResize);
onWindowResize();

function animate(time) {
  requestAnimationFrame(animate);
  let volume = 0;
  if (analyser && dataArray) {
    analyser.getByteTimeDomainData(dataArray);
    audioTexture.needsUpdate = true;
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += Math.abs(dataArray[i] - 128) / 128.0;
    volume = sum / dataArray.length;
  }
  const bx = currentScaleW * ORB_X_OFFSET, bs = currentScaleH * ORB_RELATIVE_SCALE;
  if (volume > 0.02) {
    fgMesh.position.x = bx + (Math.random() - 0.5) * volume * SHAKE_INTENSITY;
    fgMesh.position.y = (Math.random() - 0.5) * volume * SHAKE_INTENSITY;
    const p = 1.0 + volume * 0.1;
    fgMesh.scale.set(bs * p, bs * p, 1);
  } else {
    fgMesh.position.x = bx; fgMesh.position.y = 0;
    fgMesh.scale.set(bs, bs, 1);
  }
  bgMaterial.uniforms.uTime.value = time * 0.001;
  renderer.render(scene, camera);
}
animate(0);

// ==========================================
// INTERACTION
// ==========================================
const chatInput = document.getElementById('chat-input');
const chatReply = document.getElementById('chat-reply');
const statusEl = document.getElementById('status');

document.body.addEventListener('click', (e) => {
  if (e.target === chatInput) return;
  ensureAudio();
  if (audioCtx?.state === 'suspended') audioCtx.resume();
});

async function handleInput(text) {
  if (processing || !text.trim()) return;
  processing = true;
  chatInput.value = '';
  chatInput.disabled = true;
  pauseListening();

  statusEl.textContent = 'PROCESSING'; statusEl.classList.add('active');

  // Chat
  chatHistory.push({ role: 'user', parts: [{ text: text.trim() }] });
  let reply = 'Signal lost.';
  try {
    const r = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_CHAT_MODEL}:generateContent?key=${GEMINI_KEY}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: chatHistory,
          generationConfig: { temperature: 1.0, maxOutputTokens: 256, thinkingConfig: { thinkingBudget: 0 } }
        })
      }
    );
    const d = await r.json();
    reply = d?.candidates?.[0]?.content?.parts?.find(p => p.text)?.text || 'Signal lost.';
    chatHistory.push({ role: 'model', parts: [{ text: reply }] });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-16);
  } catch(e) { console.error('Chat error:', e); }

  chatReply.textContent = reply;
  chatReply.classList.add('visible');

  // TTS
  try { await speak(reply); } catch(e) { console.error('Speak error:', e); }

  statusEl.textContent = 'LISTENING'; statusEl.classList.remove('active');
  chatInput.disabled = false;
  chatInput.placeholder = 'speak...';
  processing = false;
  resumeListening();
  setTimeout(() => chatReply.classList.remove('visible'), 4000);
}

chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleInput(chatInput.value); });

// ==========================================
// SPEECH RECOGNITION
// ==========================================
let recognition = null, listening = false;

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { statusEl.textContent = 'NO MIC API'; return; }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    if (processing) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal && e.results[i][0].transcript.trim().length > 1) {
        handleInput(e.results[i][0].transcript);
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') { statusEl.textContent = 'MIC DENIED'; return; }
    if (listening && !processing) setTimeout(() => { try { recognition.start(); } catch(x){} }, 500);
  };

  recognition.onend = () => {
    if (listening && !processing) setTimeout(() => { try { recognition.start(); } catch(x){} }, 300);
  };

  listening = true;
  recognition.start();
  statusEl.textContent = 'LISTENING';
}

function pauseListening() { if (recognition) try { recognition.stop(); } catch(e){} }
function resumeListening() { if (recognition && listening) setTimeout(() => { try { recognition.start(); } catch(e){} }, 200); }

startListening();
</script>
</body>
</html>
